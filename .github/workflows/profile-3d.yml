name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Chetan-Kiran
          template: classic
          base: ""
          filename: github-3d-contrib.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
